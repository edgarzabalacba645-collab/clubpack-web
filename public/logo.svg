<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Marca de PLAYLIST: auriculares simplificados, trazo grueso y sin
       brillo/blur (la versión anterior era un dibujo neón con líneas finas
       que a 16-32px —favicon, taskbar— quedaba un borrón sin forma
       reconocible). Colores: el mismo degradé violeta->rosa que ya usa la
       marca de acento de la app en modo oscuro (--color-accent-violet /
       --color-accent-pink en index.css), no uno inventado de cero. -->
  <defs>
    <linearGradient id="mark" x1="130" y1="140" x2="382" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#13142b"/>
  <path d="M 140.6 239.1 A 120 120 0 0 1 371.4 239.1"
        fill="none" stroke="url(#mark)" stroke-width="44" stroke-linecap="round"/>
  <rect x="108.6" y="218.7" width="64" height="170" rx="32.0" fill="url(#mark)"/>
  <rect x="339.4" y="218.7" width="64" height="170" rx="32.0" fill="url(#mark)"/>
</svg>
